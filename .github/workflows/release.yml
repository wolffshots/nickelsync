name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # Kobo.tgz has the Qt 5 and the Qt 6 build (firmware 4.x and 6.x).
      # KoboRoot.tgz has the Qt 5 build only (firmware 4.x and kpm).
      - name: Build Kobo.tgz and KoboRoot.tgz
        run: |
          ENGINE=docker VERSION="${{ github.ref_name }}" sh tools/build-kobo.sh
          sha256sum Kobo.tgz KoboRoot.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "NickelSync ${{ github.ref_name }}" \
            --generate-notes \
            Kobo.tgz KoboRoot.tgz SHA256SUMS
