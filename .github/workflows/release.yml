name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build KoboRoot.tgz with NickelTC
        run: |
          docker run --rm -v "$PWD":/src -w /src ghcr.io/pgaskin/nickeltc:1.0 \
            make clean all koboroot VERSION="${{ github.ref_name }}"
          sha256sum KoboRoot.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "NickelSync ${{ github.ref_name }}" \
            --generate-notes \
            KoboRoot.tgz SHA256SUMS
